name: Build Executables

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows you to manually trigger the build from GitHub

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # You can change this if you use a different version

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk x11-utils libx11-dev libgl1 libglib2.0-0 libfuse2

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      run: pyinstaller F1_Visualizer.spec

    # --- MACOS DMG STEP ---
    - name: Create DMG (macOS)
      if: runner.os == 'macOS'
      run: |
        # Package the raw .app file into a neat .dmg installer
        hdiutil create -volname "F1_Visualizer" -srcfolder dist/F1_Visualizer.app -ov -format UDZO dist/F1_Visualizer-macOS.dmg
        # Remove the raw .app so we only upload the .dmg
        rm -rf dist/F1_Visualizer.app 

    # --- LINUX APPIMAGE STEP ---
    - name: Create AppImage (Linux)
      if: runner.os == 'Linux'
      run: |
        # Setup standard AppImage directory structure
        mkdir -p AppDir/usr/bin
        cp dist/F1_Visualizer AppDir/usr/bin/
        
        # Create AppRun script
        cat << 'EOF' > AppDir/AppRun
        #!/bin/sh
        HERE="$(dirname "$(readlink -f "${0}")")"
        exec "${HERE}/usr/bin/F1_Visualizer" "$@"
        EOF
        chmod +x AppDir/AppRun
        
        # Create Desktop file
        cat << 'EOF' > AppDir/F1_Visualizer.desktop
        [Desktop Entry]
        Name=F1 Visualizer
        Exec=F1_Visualizer
        Icon=F1_Visualizer
        Type=Application
        Categories=Utility;
        EOF
        
        # Dummy icon to satisfy appimagetool requirements
        touch AppDir/F1_Visualizer.png 
        
        # Download AppImageTool
        wget -nc https://github.com/AppImage/AppImageKit/releases/download/13/appimagetool-x86_64.AppImage
        chmod +x appimagetool-x86_64.AppImage
        
        # Package it!
        ARCH=x86_64 ./appimagetool-x86_64.AppImage AppDir dist/F1_Visualizer-Linux.AppImage
        
        # Remove raw binary so we only upload the AppImage
        rm dist/F1_Visualizer 

    # --- ARTIFACT UPLOAD ---
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: F1_Visualizer-${{ runner.os }}
        path: |
          dist/*.exe
          dist/*.dmg
          dist/*.AppImage
